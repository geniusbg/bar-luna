# Apache CORS Fix - Add to bar-luna-le-ssl.conf
# Добавете ПРЕДИ другите Location блокове

# CORS headers за Next.js RSC (React Server Components)
<Location />
  # Allow same-origin requests
  Header always set Access-Control-Allow-Origin "https://bar-luna.com"
  Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
  Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
  Header always set Access-Control-Allow-Credentials "true"
  
  # Handle preflight OPTIONS requests
  RewriteEngine On
  RewriteCond %{REQUEST_METHOD} OPTIONS
  RewriteRule ^(.*)$ $1 [R=200,L]
</Location>

# ИЛИ по-просто решение (ако горното не работи):
# Премахнете Content-Security-Policy от Apache напълно
# и оставете Next.js да управлява всички headers

# ПЪЛНА СЕКЦИЯ ЗА ЗАМЯНА:
<Location />
  # Основни security headers
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set X-XSS-Protection "1; mode=block"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  
  # CORS за Next.js RSC
  Header always set Access-Control-Allow-Origin "https://bar-luna.com"
  Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
  Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, RSC"
  Header always set Access-Control-Allow-Credentials "true"
  
  # Cache control (НЕ за API routes)
  Header always set Cache-Control "public, max-age=31536000, immutable"
</Location>

# Handle OPTIONS (preflight) requests
<LocationMatch ".*">
  <If "%{REQUEST_METHOD} == 'OPTIONS'">
    Header always set Access-Control-Allow-Origin "https://bar-luna.com"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, RSC, Next-Router-State-Tree, Next-Router-Prefetch"
    Header always set Access-Control-Max-Age "3600"
    Header always set Content-Length "0"
    Header always set Content-Type "text/plain"
  </If>
</LocationMatch>

