# Apache CSP Fix - Add to bar-luna-le-ssl.conf

# ВАЖНО: Премахнете или коментирайте старите CSP headers в секцията <Location />
# Замените тази секция:

# Security headers за PWA
<Location />
  # Основни security headers
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set X-XSS-Protection "1; mode=block"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Cache-Control "public, max-age=31536000, immutable"
  
  # ПРЕМАХНАТО: Header always set Content-Security-Policy
  # Причина: Next.js вече управлява CSP headers и те са правилно конфигурирани
</Location>

# HSTS header
<Location />
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</Location>

# ЗАБЕЛЕЖКА:
# - Next.js автоматично добавя правилните CSP headers
# - Apache НЕ трябва да override-ва тези headers
# - Ако има конфликт, Next.js headers имат приоритет

