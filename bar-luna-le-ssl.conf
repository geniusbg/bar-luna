<IfModule mod_ssl.c>

<VirtualHost 66.29.142.10:443>
    ServerName bar-luna.com
    ServerAlias www.bar-luna.com

    ProxyPreserveHost On
    ProxyRequests Off

    # ============================================
    # UPLOADS: Serve от external директория (защитени от deploy)
    # ============================================
    Alias /uploads /var/www/uploads/bar-luna
    <Directory /var/www/uploads/bar-luna>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        
        # Cache uploaded images
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>
    
    # ============================================
    # Service Worker: Serve директно от файлова система (работи дори когато Next.js е спрян)
    # ============================================
    Alias /sw.js /var/www/html/bar-luna/public/sw.js
    <Files "sw.js">
        Require all granted
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
        Header set Content-Type "application/javascript"
    </Files>

    # WebSockets support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://localhost:4000/$1" [P,L]

    # HTTP proxy (uploads and sw.js са excluded заради Alias)
    ProxyPass        /sw.js !
    ProxyPass        /uploads !
    ProxyPass        / http://127.0.0.1:4000/ retry=0
    ProxyPassReverse / http://127.0.0.1:4000/

    # API routes - без кеширане
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </LocationMatch>

    # Socket.io - специални настройки
    <LocationMatch "^/socket\.io/">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </LocationMatch>

    # Manifest файлове - с кеширане
    <LocationMatch "^/(manifest|admin-manifest)\.json$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set Content-Type "application/manifest+json"
    </LocationMatch>

    # Icons и CSS - с кеширане
    <LocationMatch "\.(png|jpg|jpeg|gif|ico|svg|css)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # JavaScript файлове - с кеширане (БЕЗ sw.js!)
    <LocationMatch "^(?!.*/sw\.js$).*\.js$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # PWA headers - Основни настройки
    <Location />
        # Security headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # CORS за Next.js RSC (React Server Components) - КРИТИЧНО!
        Header always set Access-Control-Allow-Origin "https://bar-luna.com"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Url"
        Header always set Access-Control-Allow-Credentials "true"
        
        # HSTS
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    </Location>

    # Handle OPTIONS (preflight) requests
    <If "%{REQUEST_METHOD} == 'OPTIONS'">
        Header always set Access-Control-Allow-Origin "https://bar-luna.com"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Url"
        Header always set Access-Control-Max-Age "86400"
        Header always set Content-Length "0"
        Header always set Content-Type "text/plain"
    </If>

    # Gzip компресия за PWA
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \.pdf$ no-gzip dont-vary
    </Location>

    # Logs
    ErrorLog  ${APACHE_LOG_DIR}/bar-luna-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/bar-luna-ssl-access.log combined

    # SSL (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bar-luna.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bar-luna.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # SSL protocols for PWA
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

</VirtualHost>

</IfModule>

